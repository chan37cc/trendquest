<style>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ─────────────────────────────────────────
   記帳本 · 共同 / 詹小寶 / 豬寶包
   兩人各自擁有:記帳月曆、總覽、分類、錢包
───────────────────────────────────────── */

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

const CURRENCIES = [
  ["TWD", "NT$"], ["USD", "US$"], ["JPY", "JP¥"], ["EUR", "€"],
  ["CNY", "CN¥"], ["HKD", "HK$"], ["GBP", "£"], ["AUD", "AU$"], ["KRW", "₩"],
];
const SYM = Object.fromEntries(CURRENCIES);

const MIN_YM = "2026-07";

const OWNERS = [
  ["shared", "🤝 共同"],
  ["me", "🐰 詹小寶"],
  ["bf", "🐷 豬寶包"],
];
const OWNER_LABEL = Object.fromEntries(OWNERS);
const P_ME = "詹小寶", P_BF = "豬寶包";

const DEF_CATS = () => ([
  { id: uid(), name: "飲食", emoji: "🍜", color: "#8A9B6E" },
  { id: uid(), name: "購物", emoji: "🛍️", color: "#C89B6D" },
  { id: uid(), name: "日用", emoji: "🧺", color: "#9AA6A0" },
  { id: uid(), name: "娛樂", emoji: "🎧", color: "#B98D7F" },
  { id: uid(), name: "交通", emoji: "🚌", color: "#8E9AB0" },
]);
const DEF_ME_WALLETS = () => ([
  { id: uid(), name: "現金", type: "cash", currency: "TWD", balance: 0 },
  { id: uid(), name: "一銀", type: "bank", currency: "TWD", balance: 0 },
  { id: uid(), name: "永豐", type: "bank", currency: "TWD", balance: 0 },
  { id: uid(), name: "中信", type: "bank", currency: "TWD", balance: 0 },
  { id: uid(), name: "國泰", type: "bank", currency: "TWD", balance: 0 },
  { id: uid(), name: "中信", type: "credit", currency: "TWD", closeDay: null, payDay: null, linkedWalletId: "", paidThrough: "" },
  { id: uid(), name: "國泰", type: "credit", currency: "TWD", closeDay: 23, payDay: 9, linkedWalletId: "", paidThrough: "" },
]);
const DEF_BF_PROFILE = () => ({
  categories: DEF_CATS(),
  wallets: [{ id: uid(), name: "現金", type: "cash", currency: "TWD", balance: 0 }],
});

const DEFAULT_DATA = () => ({
  profiles: {
    me: { categories: DEF_CATS(), wallets: DEF_ME_WALLETS() },
    bf: DEF_BF_PROFILE(),
  },
  records: [],
});

/* ── 日期工具 ── */
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => iso(new Date());
const nowYm = () => todayStr().slice(0, 7);
const shiftYm = (ym, delta) => {
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
};
const clampDate = (y, m, day) => {
  const dim = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(day, dim));
};
const lastCloseDate = (closeDay, ref = new Date()) => {
  let c = clampDate(ref.getFullYear(), ref.getMonth(), closeDay);
  if (iso(c) > iso(ref)) c = clampDate(ref.getFullYear(), ref.getMonth() - 1, closeDay);
  return c;
};
const dueDateFor = (closeDate, payDay) => {
  let d = clampDate(closeDate.getFullYear(), closeDate.getMonth(), payDay);
  if (iso(d) <= iso(closeDate)) d = clampDate(closeDate.getFullYear(), closeDate.getMonth() + 1, payDay);
  return d;
};
const cardStat = (card, records) => {
  const recs = records.filter((r) => r.walletId === card.id);
  const pt = card.paidThrough || "";
  if (!card.closeDay || !card.payDay) {
    const upcoming = recs.filter((r) => r.date > pt).reduce((s, r) => s + r.amount, 0);
    return { due: 0, upcoming, dueDate: null, lastClose: null, ready: false };
  }
  const lc = lastCloseDate(card.closeDay);
  const lcIso = iso(lc);
  const due = recs.filter((r) => r.date > pt && r.date <= lcIso).reduce((s, r) => s + r.amount, 0);
  const upcoming = recs.filter((r) => r.date > lcIso).reduce((s, r) => s + r.amount, 0);
  return { due, upcoming, dueDate: iso(dueDateFor(lc, card.payDay)), lastClose: lcIso, ready: true };
};

const fmtC = (n, cur = "TWD") =>
  (SYM[cur] || cur) + " " + Math.round(n).toLocaleString("zh-TW");

/* 兩人資料存取 */
const allWallets = (d) => [...(d.profiles?.me?.wallets || []), ...(d.profiles?.bf?.wallets || [])];
const allCats = (d) => [...(d.profiles?.me?.categories || []), ...(d.profiles?.bf?.categories || [])];
const findWallet = (d, id) => allWallets(d).find((w) => w.id === id);
const findCat = (d, id) => allCats(d).find((c) => c.id === id);

/* 舊資料升級(頂層 categories/wallets → 歸到詹小寶名下)*/
const migrate = (d) => {
  d.records ||= [];
  if (!d.profiles) {
    d.profiles = {
      me: {
        categories: d.categories?.length ? d.categories : DEF_CATS(),
        wallets: d.wallets?.length ? d.wallets : DEF_ME_WALLETS(),
      },
      bf: DEF_BF_PROFILE(),
    };
    delete d.categories;
    delete d.wallets;
  }
  d.profiles.me ||= { categories: DEF_CATS(), wallets: DEF_ME_WALLETS() };
  d.profiles.bf ||= DEF_BF_PROFILE();
  d.profiles.me.categories ||= DEF_CATS();
  d.profiles.me.wallets ||= DEF_ME_WALLETS();
  d.profiles.bf.categories ||= DEF_CATS();
  d.profiles.bf.wallets ||= [{ id: uid(), name: "現金", type: "cash", currency: "TWD", balance: 0 }];

  /* 詹小寶錢包的既有預設補強 */
  const mw = d.profiles.me.wallets;
  if (!mw.some((w) => w.type === "cash"))
    mw.unshift({ id: uid(), name: "現金", type: "cash", currency: "TWD", balance: 0 });
  mw.forEach((w) => {
    if (w.type !== "credit") return;
    w.paidThrough ??= "";
    w.closeDay ??= null;
    if (w.name === "國泰" && !w.closeDay) {
      w.closeDay = 23;
      w.payDay = w.payDay || 9;
      if (!w.linkedWalletId) {
        const acct = mw.find((x) => x.type !== "credit" && x.name === "國泰");
        if (acct) w.linkedWalletId = acct.id;
      }
    }
  });
  d.profiles.bf.wallets.forEach((w) => {
    if (w.type === "credit") { w.paidThrough ??= ""; w.closeDay ??= null; }
  });

  d.records.forEach((r) => {
    r.owner ||= "shared";
    if (r.owner === "shared") r.payer ||= "me";
  });
  return d;
};

/* 繳款日到了 → 自動從連結帳戶扣本期應繳(兩人的卡都適用)*/
const autoSettle = (d) => {
  const today = todayStr();
  const notices = [];
  allWallets(d).forEach((card) => {
    if (card.type !== "credit" || !card.closeDay || !card.payDay || !card.linkedWalletId) return;
    let lc = lastCloseDate(card.closeDay);
    let guard = 0;
    while (guard++ < 4 && iso(dueDateFor(lc, card.payDay)) > today) {
      lc = clampDate(lc.getFullYear(), lc.getMonth() - 1, card.closeDay);
    }
    const lcIso = iso(lc);
    if (guard > 4 || lcIso <= (card.paidThrough || "")) return;
    const amount = d.records
      .filter((r) => r.walletId === card.id && r.date > (card.paidThrough || "") && r.date <= lcIso)
      .reduce((s, r) => s + r.amount, 0);
    const acct = findWallet(d, card.linkedWalletId);
    if (amount > 0 && acct) {
      acct.balance -= amount;
      notices.push(`已自動扣款:${card.name}卡費 ${fmtC(amount, card.currency)},從「${acct.name}」扣除`);
    }
    card.paidThrough = lcIso;
  });
  return notices;
};

const CATEGORY_COLORS = ["#8A9B6E", "#C89B6D", "#9AA6A0", "#B98D7F", "#8E9AB0", "#B7A77C", "#97876F", "#A98FA0"];
const EMOJIS = ["🍜","🛍️","🧺","🎧","🚌","💊","☕","🏠","📚","🎁","🐈","💄","🧾","✈️","🎬","🌿"];

/* ─────────────────────────────────────────
   儲存層
───────────────────────────────────────── */
const firebaseReady = (() => {
  try {
    if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.includes("貼上")) return false;
    firebase.initializeApp(FIREBASE_CONFIG);
    return true;
  } catch (e) {
    console.warn("Firebase 初始化失敗:", e);
    return false;
  }
})();
const docRef = firebaseReady ? firebase.firestore().collection(DOC_COLLECTION).doc(DOC_ID) : null;
const LOCAL_KEY = "ledger-local-v1";

const sha256Hex = async (str) => {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
};

function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("shared");
  const [sync, setSync] = useState("載入中…");
  const [modal, setModal] = useState(null);
  const [dayView, setDayView] = useState(null);
  const [notices, setNotices] = useState([]);
  const saveTimer = useRef(null);
  const lastWritten = useRef("");
  const settled = useRef(false);
  const seeded = useRef(false);
  const started = useRef(false);

  useEffect(() => {
    if (started.current) return;
    started.current = true;

    const applyIncoming = (raw) => {
      let d;
      try { d = migrate(JSON.parse(raw)); }
      catch { d = DEFAULT_DATA(); }
      if (!settled.current) {
        settled.current = true;
        const ns = autoSettle(d);
        if (ns.length) setNotices((p) => [...p, ...ns]);
      }
      setData(d);
      setSync(firebaseReady ? "已同步 ☁︎" : "僅本機儲存");
    };

    if (docRef) {
      (async () => {
        try {
          if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
        } catch (e) { console.warn(e); }
        docRef.onSnapshot(
          async (snap) => {
            if (snap.metadata.hasPendingWrites) return;
            if (!snap.exists) {
              if (seeded.current) return;
              seeded.current = true;
              let json = JSON.stringify(DEFAULT_DATA());
              try {
                const sess = JSON.parse(localStorage.getItem("ledger-sess-v2") || "null");
                const oldId = sess?.dataId || localStorage.getItem("ledger-docid-v1");
                if (oldId) {
                  const os = await firebase.firestore().collection(DOC_COLLECTION).doc(oldId).get();
                  if (os.exists && os.data().json) {
                    json = os.data().json;
                    setNotices((p) => [...p, "已把舊帳本的資料搬進新版共同帳本 ✓"]);
                  }
                }
              } catch (e) { console.warn(e); }
              await docRef.set({ json, updatedAt: new Date().toISOString() });
              return;
            }
            const raw = snap.data().json || JSON.stringify(DEFAULT_DATA());
            if (raw === lastWritten.current) return;
            applyIncoming(raw);
          },
          (err) => {
            console.error(err);
            setSync("連線失敗,請檢查 Firebase 設定");
            applyIncoming(localStorage.getItem(LOCAL_KEY) || JSON.stringify(DEFAULT_DATA()));
          }
        );
      })();
    } else {
      setNotices((p) => [...p, "warn:尚未設定 Firebase,資料只存在這台裝置,無法共同編輯。"]);
      applyIncoming(localStorage.getItem(LOCAL_KEY) || JSON.stringify(DEFAULT_DATA()));
    }
  }, []);

  useEffect(() => {
    if (!data) return;
    const json = JSON.stringify(data);
    if (json === lastWritten.current) return;
    setSync("儲存中…");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      lastWritten.current = json;
      try {
        if (docRef) {
          await docRef.set({ json, updatedAt: new Date().toISOString() });
          setSync("已同步 ☁︎");
        } else {
          localStorage.setItem(LOCAL_KEY, json);
          setSync("僅本機儲存");
        }
      } catch (e) {
        console.error(e);
        setSync("儲存失敗");
      }
    }, 700);
  }, [data]);

  const update = (fn) => setData((d) => fn(structuredClone(d)));

  /* 資料救援:用舊版通關密語找回搬家前的帳本 */
  const recover = async () => {
    const pass = prompt("輸入你之前使用的通關密語(舊版密碼):");
    if (!pass || !pass.trim()) return;
    try {
      if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
      const key = await sha256Hex("ledger::" + pass.trim());
      let snap = await firebase.firestore().collection(DOC_COLLECTION).doc(key).get();
      if (!snap.exists) { alert("找不到這個密語對應的帳本,確認一下有沒有打錯字?"); return; }
      let dta = snap.data();
      if (dta.role && dta.dataId) {
        snap = await firebase.firestore().collection(DOC_COLLECTION).doc(dta.dataId).get();
        if (!snap.exists || !snap.data().json) { alert("找到密語,但對應的資料文件是空的。"); return; }
        dta = snap.data();
      }
      if (!dta.json) { alert("這個帳本裡沒有資料。"); return; }
      const old = migrate(JSON.parse(dta.json));
      const ok = confirm(`找到舊帳本了!\n共 ${old.records.length} 筆紀錄。\n\n按「確定」匯入(會以舊資料覆蓋目前的帳本內容,分類與錢包會歸到詹小寶名下)。`);
      if (!ok) return;
      setData(old);
      setNotices((p) => [...p, `已找回舊帳本:${old.records.length} 筆紀錄 ✓(舊紀錄先放在「共同」帳,可逐筆編輯搬移)`]);
    } catch (e) {
      console.error(e);
      alert("讀取失敗:" + (e?.message || ""));
    }
  };

  if (!data)
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <p style={{ color: "var(--sub)" }}>載入中…</p>
      </div>
    );

  return (
    <div style={{ padding: "24px 16px 64px" }}>
      <div style={{ maxWidth: 760, margin: "0 auto" }}>
        <header style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "0 4px", marginBottom: 18 }}>
          <h1 style={{ fontSize: 24, fontWeight: 900, margin: 0, letterSpacing: ".02em" }}>
            記帳本<span style={{ color: "var(--accent)" }}>.</span>
          </h1>
          <span style={{ fontSize: 12.5, color: "var(--sub)" }}>{sync}</span>
        </header>

        {notices.map((n, i) =>
          n.startsWith("warn:")
            ? <div key={i} className="notice warn">⚠️ {n.slice(5)}</div>
            : <div key={i} className="notice">💚 {n}</div>

        {firebaseReady && data.records.length === 0 && (
          <div className="notice warn" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
            <span>📦 之前的紀錄不見了?新版換了資料位置,舊資料還在雲端。</span>
            <button className="btn" style={{ background: "var(--clay)", flexShrink: 0 }} onClick={recover}>輸入舊密語找回資料</button>
          </div>
        )}

        <div className="seg" style={{ marginBottom: 20 }}>
          {OWNERS.map(([k, label]) => (
            <button key={k} className={tab === k ? "on" : ""} onClick={() => setTab(k)}>{label}</button>
          ))}
        </div>

        {tab === "shared" && (
          <SharedTab data={data} update={update}
            openRec={(payload) => setModal({ type: "rec", ...payload })}
            openDay={(date) => setDayView({ date, owner: "shared" })} />
        )}
        {tab === "me" && (
          <PersonHub key="me" p="me" data={data} update={update} setModal={setModal}
            openRec={(payload) => setModal({ type: "rec", ...payload })}
            openDay={(date) => setDayView({ date, owner: "me" })} />
        )}
        {tab === "bf" && (
          <PersonHub key="bf" p="bf" data={data} update={update} setModal={setModal}
            openRec={(payload) => setModal({ type: "rec", ...payload })}
            openDay={(date) => setDayView({ date, owner: "bf" })} />
        )}
      </div>

      {dayView && (
        <DayModal date={dayView.date} owner={dayView.owner} data={data} update={update}
          onClose={() => setDayView(null)}
          openRec={(payload) => setModal({ type: "rec", ...payload })} />
      )}
      {modal?.type === "rec" && (
        <RecordModal item={modal.item} preset={modal.preset} data={data} update={update} onClose={() => setModal(null)} />
      )}
      {modal?.type === "cat" && <CatModal p={modal.p} item={modal.item} onClose={() => setModal(null)} update={update} />}
      {modal?.type === "wallet" && (
        <WalletModal p={modal.p} item={modal.item} wallets={data.profiles[modal.p].wallets} onClose={() => setModal(null)} update={update} />
      )}
    </div>
  );
}

/* ── 共用 ── */
const sumByCur = (records, d) => {
  const map = {};
  records.forEach((r) => {
    const cur = r.currency || findWallet(d, r.walletId)?.currency || "TWD";
    map[cur] = (map[cur] || 0) + r.amount;
  });
  return map;
};
const curLine = (map) =>
  Object.entries(map).map(([c, v]) => fmtC(v, c)).join(" ＋ ") || fmtC(0);

/* 共同帳平分後,映射到個人分頁的虛擬紀錄(金額減半)*/
const halfShared = (records) =>
  records.filter((r) => r.owner === "shared").map((r) => ({ ...r, amount: r.amount / 2, _mirror: true }));

const walletIcon = (w) => (w.type === "credit" ? "💳" : w.type === "cash" ? "👛" : "🏦");

function Field({ label, children }) {
  return (
    <label style={{ display: "block" }}>
      <span style={{ fontSize: 12.5, color: "var(--sub)", fontWeight: 500, display: "block", marginBottom: 5 }}>{label}</span>
      {children}
    </label>
  );
}

const deleteRecord = (rec, data, update, msg) => {
  const w = findWallet(data, rec.walletId);
  if (w?.type === "credit" && rec.date <= (w.paidThrough || "")) {
    if (!confirm("這筆卡費已經扣款過了,刪除不會退回帳戶餘額。確定刪除嗎?")) return;
  } else if (!confirm(msg || "確定刪除這筆紀錄嗎?")) return;
  update((d) => {
    d.records = d.records.filter((r) => r.id !== rec.id);
    const ww = findWallet(d, rec.walletId);
    if (ww && ww.type !== "credit") ww.balance += rec.amount;
    return d;
  });
};

/* 一列紀錄(_mirror = 共同帳平分到個人分頁的鏡射列)*/
function RecRow({ r, data, update, openRec }) {
  const orig = r._mirror ? (data.records.find((x) => x.id === r.id) || r) : r;
  const c = findCat(data, r.categoryId);
  const w = findWallet(data, r.walletId);
  return (
    <div className="rec-row" style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: "1px solid var(--line)", fontSize: 14.5 }}>
      <span style={{ width: 36, height: 36, borderRadius: 12, flexShrink: 0, background: (c?.color || "#999") + "26", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17 }}>{c?.emoji || "❓"}</span>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontWeight: 500 }}>
          {c?.name || "未分類"}
          {r.note && <span style={{ color: "var(--sub)", fontWeight: 400 }}> · {r.note}</span>}
          {r._mirror && <span className="chip" style={{ background: "var(--clay-soft)", color: "var(--clay)", marginLeft: 8 }}>🤝 共同 ½</span>}
        </div>
        <div style={{ fontSize: 12, color: "var(--sub)" }}>
          {r.date}{w ? ` · ${w.name}${w.type === "credit" ? "(卡)" : ""}` : " · 未指定錢包"}
          {r.owner === "shared" && <> · {r.payer === "bf" ? P_BF : P_ME}付{r._mirror && <>全額 {fmtC(orig.amount, orig.currency)}</>}</>}
        </div>
      </div>
      <div className="num" style={{ fontWeight: 700 }}>-{fmtC(r.amount, r.currency)}</div>
      <div className="rec-act">
        <button className="btn ghost" onClick={() => openRec({ item: orig })} aria-label="編輯">✎</button>
        <button className="btn ghost danger"
          onClick={() => deleteRecord(orig, data, update, r._mirror ? "這是共同帳的紀錄,刪除會整筆刪掉,兩個人的分頁都會一起消失。確定嗎?" : undefined)}
          aria-label="刪除">✕</button>
      </div>
    </div>
  );
}

/* ───────── 月曆 ───────── */
function Calendar({ ym, records, onPick }) {
  const [y, m] = ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const lead = first.getDay();
  const today = todayStr();

  const countByDay = {};
  records.forEach((r) => {
    if (r.date.startsWith(ym)) {
      const day = Number(r.date.slice(8, 10));
      countByDay[day] = (countByDay[day] || 0) + 1;
    }
  });

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  return (
    <div className="cal">
      {["日", "一", "二", "三", "四", "五", "六"].map((w) => <div key={w} className="dow">{w}</div>)}
      {cells.map((d, i) => {
        if (d === null) return <div key={"b" + i} className="day blank" />;
        const dateStr = `${ym}-${pad(d)}`;
        const cnt = countByDay[d] || 0;
        return (
          <button key={d} className={`day ${dateStr === today ? "today" : ""}`} onClick={() => onPick(dateStr)}>
            <span className="dnum">{d}</span>
            <span className="dots">
              {Array.from({ length: Math.min(cnt, 6) }).map((_, j) => <span key={j} className="dot" />)}
            </span>
          </button>
        );
      })}
    </div>
  );
}

/* ───────── 記帳月曆面板(共同與個人共用)───────── */
function CalendarPane({ owner, data, update, openRec, openDay, extra }) {
  const { records } = data;
  const [ym, setYm] = useState(() => (nowYm() < MIN_YM ? MIN_YM : nowYm()));
  const [y, m] = ym.split("-").map(Number);

  const own = records.filter((r) => r.owner === owner);
  const mine = owner === "shared" ? own : own.concat(halfShared(records));
  const monthRecs = mine.filter((r) => r.date.startsWith(ym));
  const totalMap = sumByCur(monthRecs, data);

  const canPrev = ym > MIN_YM;
  const canNext = ym < nowYm();

  return (
    <div className="fade">
      <div className="card" style={{ padding: "20px 20px 16px", marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontSize: 15.5, fontWeight: 700 }}>{OWNER_LABEL[owner]}・{y} 年 {m} 月</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn icon" disabled={!canPrev} onClick={() => setYm(shiftYm(ym, -1))} aria-label="上個月">←</button>
            <button className="btn icon" disabled={!canNext} onClick={() => setYm(shiftYm(ym, 1))} aria-label="下個月">→</button>
          </div>
        </div>
        <Calendar ym={ym} records={mine} onPick={openDay} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 14, borderTop: "1px solid var(--line)", paddingTop: 12 }}>
          <div style={{ fontSize: 13.5, color: "var(--sub)" }}>
            {m} 月支出 <b className="num" style={{ color: "var(--ink)", fontSize: 15 }}>{curLine(totalMap)}</b>
            <span style={{ marginLeft: 8 }}>{monthRecs.length} 筆</span>
          </div>
          <button className="btn" onClick={() => openRec({ preset: { date: todayStr(), owner } })}>＋ 記一筆</button>
        </div>
      </div>

      {extra}

      <div className="card" style={{ padding: "20px 24px" }}>
        <div style={{ fontSize: 15.5, fontWeight: 700, marginBottom: 6 }}>{m} 月的紀錄</div>
        {monthRecs.length === 0 && <p style={{ color: "var(--sub)", fontSize: 14 }}>這個月還沒有紀錄,按「＋ 記一筆」開始吧。</p>}
        {monthRecs
          .slice()
          .sort((a, b) => (a.date < b.date ? 1 : -1))
          .map((r) => (
            <RecRow key={r.id + (r._mirror ? "m" : "")} r={r} data={data} update={update} openRec={openRec} />
          ))}
      </div>
    </div>
  );
}

/* ───────── 共同分頁(月曆 + 結算)───────── */
function SharedTab({ data, update, openRec, openDay }) {
  const act = data.records.filter((r) => r.owner === "shared" && !r.settled && (r.currency || "TWD") === "TWD");
  const paidBF = act.filter((r) => r.payer === "bf").reduce((s, r) => s + r.amount, 0);
  const paidME = act.filter((r) => r.payer !== "bf").reduce((s, r) => s + r.amount, 0);
  const total = paidBF + paidME;
  const net = paidBF - total / 2;

  const settleAll = () => {
    if (!act.length) return;
    const msg = net === 0
      ? "這一輪剛好互不相欠,確定結清嗎?"
      : `結清:${net > 0 ? P_ME : P_BF} 給 ${net > 0 ? P_BF : P_ME} ${fmtC(Math.abs(net))},確定嗎?`;
    if (!confirm(msg)) return;
    update((d) => {
      d.records.forEach((r) => { if (r.owner === "shared" && !r.settled) r.settled = true; });
      return d;
    });
  };

  const settleCard = (
    <div className="card" style={{ padding: "18px 22px", marginBottom: 16, borderTop: "4px solid var(--clay)" }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <div style={{ background: "var(--clay-soft)", borderRadius: 14, padding: "10px 12px", textAlign: "center" }}>
          <div style={{ fontSize: 12.5, color: "var(--sub)", fontWeight: 500 }}>🐷 {P_BF} 先付了</div>
          <div className="num" style={{ fontSize: 20, fontWeight: 900, color: "var(--clay)" }}>{fmtC(paidBF)}</div>
        </div>
        <div style={{ background: "var(--accent-soft)", borderRadius: 14, padding: "10px 12px", textAlign: "center" }}>
          <div style={{ fontSize: 12.5, color: "var(--sub)", fontWeight: 500 }}>🐰 {P_ME} 先付了</div>
          <div className="num" style={{ fontSize: 20, fontWeight: 900, color: "var(--accent-deep)" }}>{fmtC(paidME)}</div>
        </div>
      </div>
      <div style={{ textAlign: "center", marginTop: 12, borderTop: "1px dashed var(--line)", paddingTop: 10 }}>
        {total === 0 ? (
          <span style={{ fontSize: 14, color: "var(--sub)" }}>目前沒有未結清的共同支出</span>
        ) : net === 0 ? (
          <span style={{ fontSize: 16, fontWeight: 900 }}>互不相欠 🎉</span>
        ) : (
          <span style={{ fontSize: 15 }}>
            <b>{net > 0 ? "🐰 " + P_ME : "🐷 " + P_BF}</b>
            <span style={{ color: "var(--sub)" }}> 要給 </span>
            <b>{net > 0 ? "🐷 " + P_BF : "🐰 " + P_ME}</b>
            <b className="num" style={{ color: "var(--clay)", marginLeft: 8, fontSize: 18 }}>{fmtC(Math.abs(net))}</b>
          </span>
        )}
        {act.length > 0 && (
          <div><button className="btn ghost" style={{ marginTop: 10 }} onClick={settleAll}>💸 已結清</button></div>
        )}
      </div>
    </div>
  );

  return <CalendarPane owner="shared" data={data} update={update} openRec={openRec} openDay={openDay} extra={settleCard} />;
}

/* ───────── 個人總覽 ───────── */
function PersonOverview({ p, data }) {
  const { records } = data;
  const prof = data.profiles[p];
  const [ym, setYm] = useState(() => (nowYm() < MIN_YM ? MIN_YM : nowYm()));
  const [y, m] = ym.split("-").map(Number);

  const mine = records.filter((r) => r.owner === p).concat(halfShared(records));
  const monthRecs = mine.filter((r) => r.date.startsWith(ym));
  const totalMap = sumByCur(monthRecs, data);
  const twdTotal = totalMap.TWD || 0;

  const catStats = prof.categories
    .map((c) => {
      const recs = monthRecs.filter((r) => r.categoryId === c.id);
      const map = sumByCur(recs, data);
      return { ...c, map, twd: map.TWD || 0, count: recs.length };
    })
    .sort((a, b) => b.twd - a.twd);
  const maxTwd = Math.max(...catStats.map((c) => c.twd), 1);

  const canPrev = ym > MIN_YM;
  const canNext = ym < nowYm();

  return (
    <div className="fade">
      <div className="card" style={{ padding: "24px 26px 22px", marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontSize: 15, fontWeight: 700 }}>{OWNER_LABEL[p]}・{y} 年 {m} 月</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn icon" disabled={!canPrev} onClick={() => setYm(shiftYm(ym, -1))} aria-label="上個月">←</button>
            <button className="btn icon" disabled={!canNext} onClick={() => setYm(shiftYm(ym, 1))} aria-label="下個月">→</button>
          </div>
        </div>
        <div style={{ fontSize: 13, color: "var(--sub)", marginTop: 10 }}>總支出(含共同平分)</div>
        <div className="num" style={{ fontSize: 40, fontWeight: 900, color: "var(--accent-deep)" }}>
          {fmtC(twdTotal)}
        </div>
        {Object.keys(totalMap).filter((c) => c !== "TWD").map((c) => (
          <div key={c} className="num" style={{ fontSize: 14.5, color: "var(--clay)", fontWeight: 700 }}>
            ＋ {fmtC(totalMap[c], c)}(外幣)
          </div>
        ))}
        <div style={{ fontSize: 13, color: "var(--sub)", marginTop: 6 }}>共 {monthRecs.length} 筆紀錄</div>
      </div>

      <div className="card" style={{ padding: "22px 26px", marginBottom: 16 }}>
        <div style={{ fontSize: 15.5, fontWeight: 700, marginBottom: 16 }}>各分類支出</div>
        {catStats.every((c) => c.count === 0) && (
          <p style={{ color: "var(--sub)", fontSize: 14 }}>{m} 月沒有任何紀錄。</p>
        )}
        {catStats.filter((c) => c.count > 0).map((c) => (
          <div key={c.id} style={{ marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 5 }}>
              <span style={{ fontSize: 14.5, fontWeight: 500 }}>{c.emoji} {c.name}
                <span style={{ color: "var(--sub)", fontSize: 12.5, marginLeft: 6 }}>{c.count} 筆</span>
              </span>
              <span className="num" style={{ fontWeight: 700, fontSize: 14.5 }}>{curLine(c.map)}</span>
            </div>
            <div className="bar-track">
              <div className="bar-fill" style={{ width: `${(c.twd / maxTwd) * 100}%`, background: c.color }} />
            </div>
          </div>
        ))}
      </div>

      <div className="card" style={{ padding: "22px 26px" }}>
        <div style={{ fontSize: 15.5, fontWeight: 700, marginBottom: 14 }}>錢包速覽</div>
        {prof.wallets.map((w) => {
          const st = w.type === "credit" ? cardStat(w, records) : null;
          return (
            <div key={w.id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid var(--line)", fontSize: 14.5, gap: 8 }}>
              <span>{walletIcon(w)} {w.name}
                {w.currency !== "TWD" && <span className="chip" style={{ background: "var(--accent-soft)", color: "var(--accent-deep)", marginLeft: 8 }}>{w.currency}</span>}
              </span>

                  </span>
                : <span className="num" style={{ fontWeight: 700 }}>{fmtC(w.balance || 0, w.currency)}</span>}
            </div>
          );
        })}

    </div>
  );
}

/* ───────── 新增 / 編輯 紀錄 ───────── */
function RecordModal({ item, preset, data, update, onClose }) {
  const meP = data.profiles.me, bfP = data.profiles.bf;
  const poolFor = (owner, payer) =>
    owner === "bf" ? bfP.wallets : owner === "me" ? meP.wallets : (payer === "bf" ? bfP.wallets : meP.wallets);
  const catsFor = (owner) => (owner === "bf" ? bfP.categories : meP.categories);

  const [form, setForm] = useState(() => {
    const owner = item?.owner || preset?.owner || "shared";
    const payer = item?.payer || "me";
    const cats = catsFor(owner);
    return {
      date: item?.date || preset?.date || todayStr(),
      owner, payer,
      categoryId: item?.categoryId && cats.some((c) => c.id === item.categoryId) ? item.categoryId : (cats[0]?.id || ""),
      walletId: item ? (item.walletId || "") : (poolFor(owner, payer)[0]?.id || ""),
      amount: item ? String(item.amount) : "",
      note: item?.note || "",
    };
  });
  const cats = catsFor(form.owner);
  const pool = poolFor(form.owner, form.payer);
  const wallet = pool.find((w) => w.id === form.walletId);

  const switchOwner = (owner) => {
    const nCats = catsFor(owner);
    const nPool = poolFor(owner, form.payer);
    setForm((f) => ({
      ...f, owner,
      categoryId: nCats.some((c) => c.id === f.categoryId) ? f.categoryId : (nCats[0]?.id || ""),
      walletId: nPool.some((w) => w.id === f.walletId) ? f.walletId : "",
    }));
  };
  const switchPayer = (payer) => {
    const nPool = poolFor(form.owner, payer);
    setForm((f) => ({
      ...f, payer,
      walletId: nPool.some((w) => w.id === f.walletId) ? f.walletId : "",
    }));
  };

  const save = () => {
    const amt = parseFloat(form.amount);
    if (!amt || amt <= 0 || !form.categoryId) return;
    update((d) => {
      const nw = findWallet(d, form.walletId);
      const currency = nw?.currency || "TWD";
      if (item) {
        const r = d.records.find((x) => x.id === item.id);
        if (!r) return d;
        const ow = findWallet(d, r.walletId);
        if (ow && ow.type !== "credit") ow.balance += r.amount;
        Object.assign(r, {
          date: form.date, owner: form.owner, categoryId: form.categoryId,
          walletId: form.walletId, amount: amt, note: form.note, currency,
          payer: form.owner === "shared" ? form.payer : null,
        });
        if (nw && nw.type !== "credit") nw.balance -= amt;
      } else {
        d.records.unshift({
          id: uid(), date: form.date, owner: form.owner, categoryId: form.categoryId,
          walletId: form.walletId, amount: amt, note: form.note, currency,
          payer: form.owner === "shared" ? form.payer : null,
        });
        if (nw && nw.type !== "credit") nw.balance -= amt;
      }
      return d;
    });
    onClose();
  };

  return (
    <div className="overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="card fade" style={{ width: "100%", maxWidth: 440, padding: "26px 24px 20px", maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ fontSize: 17.5, fontWeight: 900, marginBottom: 16 }}>{item ? "編輯紀錄" : "新增支出"}</div>

        <div style={{ marginBottom: 14 }}>
          <span style={{ fontSize: 12.5, color: "var(--sub)", fontWeight: 500, display: "block", marginBottom: 6 }}>記在哪一本</span>
          <div className="pill-group">
            {OWNERS.map(([v, label]) => (
              <button key={v} className={`pill ${form.owner === v ? "on" : ""}`} onClick={() => switchOwner(v)}>{label}</button>
            ))}
          </div>
        </div>

        {form.owner === "shared" && (
          <div style={{ marginBottom: 14 }}>
            <span style={{ fontSize: 12.5, color: "var(--sub)", fontWeight: 500, display: "block", marginBottom: 6 }}>誰先付的錢(用誰的錢包)</span>
            <div className="pill-group">
              {[["me", "🐰 " + P_ME], ["bf", "🐷 " + P_BF]].map(([v, label]) => (
                <button key={v} className={`pill ${form.payer === v ? "on" : ""}`} onClick={() => switchPayer(v)}>{label}</button>
              ))}
            </div>
          </div>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <Field label="日期"><input type="date" className="inp" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
          <Field label="金額">
            <input type="number" min="0" className="inp" placeholder="0" value={form.amount}
              onChange={(e) => setForm({ ...form, amount: e.target.value })}
              onKeyDown={(e) => e.key === "Enter" && save()} />
          </Field>
          <Field label="分類">
            <select className="sel" value={form.categoryId} onChange={(e) => setForm({ ...form, categoryId: e.target.value })}>
              {cats.map((c) => <option key={c.id} value={c.id}>{c.emoji} {c.name}</option>)}
            </select>
          </Field>
          <Field label={`錢包(${form.owner === "bf" || (form.owner === "shared" && form.payer === "bf") ? P_BF : P_ME}的)`}>
            <select className="sel" value={form.walletId} onChange={(e) => setForm({ ...form, walletId: e.target.value })}>
              <option value="">— 不扣款(僅記錄)—</option>
              {pool.map((w) => <option key={w.id} value={w.id}>{walletIcon(w)} {w.name}{w.type === "credit" ? "(信用卡)" : ""}{w.currency !== "TWD" ? `(${w.currency})` : ""}</option>)}
            </select>
          </Field>
        </div>
        {wallet?.type === "credit" && (
          <div style={{ fontSize: 12.5, color: "var(--clay)", marginTop: 8, fontWeight: 500 }}>
            💳 這筆會進入「{wallet.name}」的信用卡待繳款,{wallet.payDay ? `繳款日再從帳戶扣除` : `記得到錢包分頁設定結帳日與繳款日`}
          </div>
        )}
        {!form.walletId && (
          <div style={{ fontSize: 12, color: "var(--sub)", marginTop: 8 }}>
            不扣款模式:只留紀錄,不會動到任何帳戶餘額
          </div>
        )}
        <div style={{ marginTop: 12 }}>
          <Field label="備註(可留白)">
            <input className="inp" placeholder="例如:巷口滷味" value={form.note}
              onChange={(e) => setForm({ ...form, note: e.target.value })}
              onKeyDown={(e) => e.key === "Enter" && save()} />
          </Field>
        </div>

        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 20 }}>
          <button className="btn ghost" onClick={onClose}>取消</button>
          <button className="btn" onClick={save}>{item ? "儲存變更" : "記下來"}</button>
        </div>
      </div>
    </div>
  );
}

/* ───────── 分類(個人)───────── */
function CatTab({ p, data, update, openModal }) {
  const cats = data.profiles[p].categories;
  const { records } = data;
  const monthKey = nowYm();

  const delCat = (c) => {
    const used = records.some((r) => r.categoryId === c.id);
    const msg = used ? `「${c.name}」已有紀錄使用,刪除後那些紀錄會顯示為未分類。確定刪除嗎?` : `確定刪除「${c.name}」嗎?`;
    if (!confirm(msg)) return;
    update((d) => { d.profiles[p].categories = d.profiles[p].categories.filter((x) => x.id !== c.id); return d; });
  };

  return (
    <div className="fade">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 15.5, fontWeight: 700 }}>{OWNER_LABEL[p]}的分類</div>
        <button className="btn" onClick={() => openModal({ type: "cat", p })}>＋ 新增分類</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(200px,1fr))", gap: 14 }}>
        {cats.map((c) => {
          const map = sumByCur(records.filter((r) => r.categoryId === c.id && r.date.startsWith(monthKey)), data);
          return (
            <div key={c.id} className="card" style={{ padding: "20px 18px 16px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                <span style={{ width: 42, height: 42, borderRadius: 14, background: c.color + "26", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 21 }}>{c.emoji}</span>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 700 }}>{c.name}</div>
                  <div className="num" style={{ fontSize: 12.5, color: "var(--sub)" }}>本月 {curLine(map)}</div>
                </div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button className="btn ghost" onClick={() => openModal({ type: "cat", p, item: c })}>編輯</button>
                <button className="btn ghost danger" onClick={() => delCat(c)}>刪除</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CatModal({ p, item, onClose, update }) {
  const [name, setName] = useState(item?.name || "");
  const [emoji, setEmoji] = useState(item?.emoji || "🍜");
  const [color, setColor] = useState(item?.color || CATEGORY_COLORS[0]);

  const save = () => {
    if (!name.trim()) return;
    update((d) => {
      const list = d.profiles[p].categories;
      if (item) Object.assign(list.find((x) => x.id === item.id), { name: name.trim(), emoji, color });
      else list.push({ id: uid(), name: name.trim(), emoji, color });
      return d;
    });
    onClose();
  };

  return (
    <Modal title={item ? "編輯分類" : "新增分類"} onClose={onClose} onSave={save}>
      <Field label="分類名稱"><input className="inp" value={name} onChange={(e) => setName(e.target.value)} placeholder="例如:寵物" autoFocus /></Field>
      <div style={{ marginTop: 14 }}>
        <span style={{ fontSize: 12.5, color: "var(--sub)", fontWeight: 500 }}>圖示</span>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 6 }}>
          {EMOJIS.map((e) => (
            <button key={e} onClick={() => setEmoji(e)} style={{
              fontSize: 19, padding: "5px 8px", borderRadius: 10, cursor: "pointer",
              border: emoji === e ? "2px solid var(--accent)" : "1px solid var(--line)",
              background: emoji === e ? "var(--accent-soft)" : "#fff",
            }}>{e}</button>
          ))}
        </div>
      </div>
      <div style={{ marginTop: 14 }}>
        <span style={{ fontSize: 12.5, color: "var(--sub)", fontWeight: 500 }}>代表色</span>
        <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
          {CATEGORY_COLORS.map((c) => (
            <button key={c} onClick={() => setColor(c)} aria-label={c} style={{
              width: 28, height: 28, borderRadius: "50%", background: c, cursor: "pointer",
              border: color === c ? "3px solid var(--ink)" : "1px solid var(--line)",
            }} />
          ))}
        </div>
      </div>
    </Modal>
  );
}

/* ───────── 錢包(個人)───────── */
function WalletTab({ p, data, update, openModal }) {
  const wallets = data.profiles[p].wallets;
  const { records } = data;
  const banks = wallets.filter((w) => w.type !== "credit");
  const cards = wallets.filter((w) => w.type === "credit");

  const delWallet = (w) => {
    if (!confirm(`確定刪除「${w.name}」嗎?相關紀錄會保留,但不再連結錢包。`)) return;
    update((d) => {
      d.profiles[p].wallets = d.profiles[p].wallets.filter((x) => x.id !== w.id);
      d.profiles[p].wallets.forEach((x) => { if (x.linkedWalletId === w.id) x.linkedWalletId = ""; });
      return d;
    });
  };

  const payEarly = (card) => {
    const st = cardStat(card, records);
    if (!st.ready) { alert("請先在編輯裡設定結帳日和繳款日"); return; }
    if (!card.linkedWalletId) { alert("這張卡還沒設定扣款帳戶喔"); return; }
    if (st.due <= 0) { alert("本期沒有應繳金額"); return; }
    const acct = wallets.find((x) => x.id === card.linkedWalletId);
    if (!confirm(`提前從「${acct?.name}」扣繳本期卡費 ${fmtC(st.due, card.currency)}?\n(未出帳的 ${fmtC(st.upcoming, card.currency)} 會留到下期)`)) return;
    update((d) => {
      const c = d.profiles[p].wallets.find((x) => x.id === card.id);
      const a = d.profiles[p].wallets.find((x) => x.id === card.linkedWalletId);
      if (a) a.balance -= st.due;
      c.paidThrough = st.lastClose;
      return d;
    });
  };

  const linkedStats = (walletId) => {
    let due = 0, upcoming = 0;
    cards.filter((c) => c.linkedWalletId === walletId).forEach((c) => {
      const st = cardStat(c, records);
      due += st.due; upcoming += st.upcoming;
    });
    return { due, upcoming };
  };

  return (
    <div className="fade">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 15.5, fontWeight: 700 }}>{OWNER_LABEL[p]}的帳戶</div>
        <button className="btn" onClick={() => openModal({ type: "wallet", p })}>＋ 新增錢包</button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(230px,1fr))", gap: 14, marginBottom: 26 }}>
        {banks.map((w) => {
          const { due, upcoming } = linkedStats(w.id);
          const after = (w.balance || 0) - due;
          return (
            <div key={w.id} className="card" style={{ padding: "20px 20px 16px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 15.5, fontWeight: 700 }}>{walletIcon(w)} {w.name}</span>
                <span className="chip" style={{ background: "var(--accent-soft)", color: "var(--accent-deep)" }}>{w.currency}</span>
              </div>
              <div className="num" style={{ fontSize: 28, fontWeight: 900, margin: "6px 0 2px", color: "var(--accent-deep)" }}>
                {fmtC(w.balance || 0, w.currency)}
              </div>
              {due > 0 && (
                <div style={{ fontSize: 13, color: "var(--sub)" }}>
                  本期卡費 {fmtC(due, w.currency)} 待扣,扣完剩{" "}
                  <b className="num" style={{ color: after < 0 ? "var(--danger)" : "var(--ink)" }}>{fmtC(after, w.currency)}</b>
                </div>
              )}
              {upcoming > 0 && (
                <div style={{ fontSize: 12.5, color: "var(--clay)" }}>未出帳待繳款 {fmtC(upcoming, w.currency)}(下期)</div>
              )}
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <button className="btn ghost" onClick={() => openModal({ type: "wallet", p, item: w })}>編輯</button>
                <button className="btn ghost danger" onClick={() => delWallet(w)}>刪除</button>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ fontSize: 15.5, fontWeight: 700, marginBottom: 14 }}>信用卡費</div>
      {cards.length === 0 && <p style={{ color: "var(--sub)", fontSize: 14 }}>還沒有信用卡,按「＋ 新增錢包」選「💳 信用卡」建立。</p>}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(260px,1fr))", gap: 14 }}>
        {cards.map((w) => {
          const st = cardStat(w, records);
          const acct = wallets.find((x) => x.id === w.linkedWalletId);
          return (
            <div key={w.id} className="card" style={{ padding: "20px 20px 16px", borderTop: "4px solid var(--clay)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 15.5, fontWeight: 700 }}>💳 {w.name}</span>
                {st.ready
                  ? <span className="chip" style={{ background: "var(--danger-soft)", color: "var(--danger)" }}>結帳 {w.closeDay} 號・繳款 {w.payDay} 號</span>
                  : <span className="chip" style={{ background: "var(--bg)", color: "var(--sub)" }}>未設定週期</span>}
              </div>

              <div style={{ marginTop: 10 }}>
                <div style={{ fontSize: 12.5, color: "var(--sub)" }}>
                  本期應繳{st.dueDate && <>(將於 <b>{st.dueDate.slice(5).replace("-", "/")}</b> 扣款)</>}
                </div>
                <div className="num" style={{ fontSize: 26, fontWeight: 900, color: "var(--danger)" }}>
                  {fmtC(st.due, w.currency)}
                </div>
              </div>

              <div style={{ marginTop: 8, background: "var(--clay-soft)", borderRadius: 12, padding: "8px 12px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                  <span style={{ color: "var(--clay)", fontWeight: 700 }}>未出帳待繳款</span>
                  <span className="num" style={{ fontWeight: 900, color: "var(--clay)" }}>{fmtC(st.upcoming, w.currency)}</span>
                </div>
                {st.lastClose && (
                  <div style={{ fontSize: 11.5, color: "var(--sub)", marginTop: 2 }}>
                    {st.lastClose.slice(5).replace("-", "/")} 之後的消費,留到下期帳單
                  </div>
                )}
              </div>

              <div style={{ fontSize: 13, color: "var(--sub)", marginTop: 8 }}>
                {acct
                  ? <>從「{acct.name}」扣款,扣完剩 <b className="num" style={{ color: (acct.balance || 0) - st.due < 0 ? "var(--danger)" : "var(--ink)" }}>
                      {fmtC((acct.balance || 0) - st.due, acct.currency)}</b></>
                  : "尚未設定扣款帳戶"}
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
                <button className="btn ghost" onClick={() => openModal({ type: "wallet", p, item: w })}>編輯</button>
                <button className="btn ghost" onClick={() => payEarly(w)}>提前扣款</button>
                <button className="btn ghost danger" onClick={() => delWallet(w)}>刪除</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function WalletModal({ p, item, wallets, onClose, update }) {
  const [name, setName] = useState(item?.name || "");
  const [type, setType] = useState(item?.type || "bank");
  const [currency, setCurrency] = useState(item?.currency || "TWD");
  const [balance, setBalance] = useState(item?.balance ?? "");
  const [closeDay, setCloseDay] = useState(item?.closeDay ?? "");
  const [payDay, setPayDay] = useState(item?.payDay ?? "");
  const [linked, setLinked] = useState(item?.linkedWalletId || "");

  const save = () => {
    if (!name.trim()) return;
    update((d) => {
      const list = d.profiles[p].wallets;
      const base = { name: name.trim(), type, currency };
      const extra = type === "credit"
        ? { closeDay: parseInt(closeDay) || null, payDay: parseInt(payDay) || null, linkedWalletId: linked, paidThrough: item?.paidThrough || "" }
        : { balance: parseFloat(balance) || 0 };
      if (item) {
        const w = list.find((x) => x.id === item.id);
        Object.assign(w, base, extra);
        if (type === "credit") delete w.balance;
        else { delete w.closeDay; delete w.payDay; delete w.linkedWalletId; delete w.paidThrough; }
      } else {
        list.push({ id: uid(), ...base, ...extra });
      }
      return d;
    });
    onClose();
  };

  const accounts = wallets.filter((w) => w.type !== "credit" && w.id !== item?.id);

  return (
    <Modal title={item ? "編輯錢包" : `新增${OWNER_LABEL[p]}的錢包`} onClose={onClose} onSave={save}>
      <Field label="錢包名稱"><input className="inp" value={name} onChange={(e) => setName(e.target.value)} placeholder="例如:美元帳戶" autoFocus /></Field>
      <div style={{ marginTop: 14 }}>
        <span style={{ fontSize: 12.5, color: "var(--sub)", fontWeight: 500 }}>類型</span>
        <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
          {[["cash", "👛 現金"], ["bank", "🏦 銀行"], ["credit", "💳 信用卡"]].map(([k, label]) => (
            <button key={k} className="btn ghost" onClick={() => setType(k)} style={{
              borderColor: type === k ? "var(--accent)" : "var(--line)",
              background: type === k ? "var(--accent-soft)" : "#fff",
              color: type === k ? "var(--accent-deep)" : "var(--sub)", fontWeight: type === k ? 700 : 500,
            }}>{label}</button>
          ))}
        </div>
      </div>
      <div style={{ marginTop: 14 }}>
        <Field label="幣別">
          <select className="sel" value={currency} onChange={(e) => setCurrency(e.target.value)}>
            {CURRENCIES.map(([c, s]) => <option key={c} value={c}>{c}({s})</option>)}
          </select>
        </Field>
      </div>

      {type !== "credit" ? (
        <div style={{ marginTop: 14 }}>
          <Field label="目前餘額"><input type="number" className="inp" value={balance} onChange={(e) => setBalance(e.target.value)} placeholder="0" /></Field>
        </div>
      ) : (
        <React.Fragment>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 14 }}>
            <Field label="結帳日(每月幾號)">
              <input type="number" min="1" max="31" className="inp" value={closeDay} onChange={(e) => setCloseDay(e.target.value)} placeholder="例如:23" />
            </Field>
            <Field label="繳款日(每月幾號)">
              <input type="number" min="1" max="31" className="inp" value={payDay} onChange={(e) => setPayDay(e.target.value)} placeholder="例如:9" />
            </Field>
          </div>
          <div style={{ fontSize: 12, color: "var(--sub)", marginTop: 6, lineHeight: 1.6 }}>
            例:結帳 23 號、繳款 9 號 → 6/24–7/23 的消費會在 8/9 從扣款帳戶自動扣除;7/24 之後的消費列為「未出帳待繳款」,留到下一期。
          </div>
          <div style={{ marginTop: 14 }}>
            <Field label="扣款帳戶">
              <select className="sel" value={linked} onChange={(e) => setLinked(e.target.value)}>
                <option value="">— 選擇帳戶 —</option>
                {accounts.map((w) => <option key={w.id} value={w.id}>{w.name}({w.currency})</option>)}
              </select>
            </Field>
          </div>
        </React.Fragment>
      )}
    </Modal>
  );
}

/* ───────── Modal ───────── */
function Modal({ title, children, onClose, onSave }) {
  return (
    <div className="overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="card fade" style={{ width: "100%", maxWidth: 420, padding: "26px 24px 20px", maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ fontSize: 17.5, fontWeight: 900, marginBottom: 18 }}>{title}</div>
        {children}
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 22 }}>
          <button className="btn ghost" onClick={onClose}>取消</button>
          <button className="btn" onClick={onSave}>儲存</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
